# ============================================================================
# OpenAlgo Smoke Test — ABC
# ============================================================================
# Variant: abc
# Tests:   HELLO + A (vol) + B (port) + C (env)
#   HELLO  — container starts, stdout logging works
#   A/vol  — NAS bind mount is readable and writable
#   B/port — port 8080 is reachable from WSL (HTTP server probe)
#   C/env  — /volume1/docker/openalgo/env/.env is mounted and parseable
#
# Usage (via deploy/smoke-test.sh abc, or manually):
#   cd /volume1/docker/openalgo/repo
#   docker compose -f docker-compose.smoke.abc.yml up -d
#   docker compose -f docker-compose.smoke.abc.yml logs -f
#   # From WSL: curl http://192.168.1.72:8080/    (B/port check)
#   docker compose -f docker-compose.smoke.abc.yml down
#
# WARNING: smoke-port binds host port 8080.
#   Do NOT run this while the main openalgo container is up.
#
# Prerequisites on NAS:
#   /volume1/docker/openalgo/db/       (created by nas-setup.sh)
#   /volume1/docker/openalgo/env/.env  (copied from env.nas.sample, filled in)
#
# Note on Synology AUFS: bind-mount destinations must already exist inside
# the image. python:3.12-slim only guarantees /tmp, so all secondary mounts
# (anything beyond the /app source mount) go under /tmp/.
# ============================================================================

services:

  smoke-hello:                          # HELLO: heartbeat logger
    image: python:3.12-slim
    container_name: openalgo-smoke-hello
    volumes:
      - /volume1/docker/openalgo/repo/test/smoke:/app:ro
    working_dir: /app
    command: python hello_smoke.py
    restart: "no"

  smoke-vol:                            # A (vol): volume mount read/write
    image: python:3.12-slim
    container_name: openalgo-smoke-vol
    volumes:
      - /volume1/docker/openalgo/repo/test/smoke:/app:ro
      - /volume1/docker/openalgo/db:/tmp/db    # /tmp always exists in image
    environment:
      - DB_PATH=/tmp/db
    working_dir: /app
    command: python vol_smoke.py
    restart: "no"

  smoke-port:                           # B (port): HTTP server on 8080
    image: python:3.12-slim
    container_name: openalgo-smoke-port
    volumes:
      - /volume1/docker/openalgo/repo/test/smoke:/app:ro
    working_dir: /app
    ports:
      - "8080:8080"
    command: python port_smoke.py
    restart: "no"

  smoke-env:                            # C (env): .env file parse verification
    image: python:3.12-slim
    container_name: openalgo-smoke-env
    volumes:
      - /volume1/docker/openalgo/repo/test/smoke:/app:ro
      - /volume1/docker/openalgo/env:/tmp/env_host:ro  # /tmp always exists
    environment:
      - ENV_FILE=/tmp/env_host/.env
    working_dir: /app
    command: python env_smoke.py
    restart: "no"
